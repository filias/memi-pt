[project]
name = "memi-portugal"
version = "0.1.0"
description = "Memi Portugal - pratica a tua memória sobre Portugal"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22",
    "memi-engine>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["memi_pt"]
